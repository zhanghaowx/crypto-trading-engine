# Jolteon dashboard theme - the Slate palette: a quiet off-white canvas,
# white card surfaces, and one Inter family throughout. The values are
# the prototype's (jolteon/dashboard/static/prototype/styles.css), which
# jolteon/dashboard/static/tokens.css repeats for the dashboard's own CSS;
# jolteon/dashboard/UI_GUIDELINES.md holds the rules behind them.

[server]
# Launching the dashboard should not also take over a browser window: the
# reader already has one open, or is on another machine entirely.
headless = true

[client]
# The header is the dashboard's own navigation. Streamlit's deploy
# button and developer menu items belong to a notebook being shared, not
# to an engine being watched.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#20262E"             # Slate ink - active elements, button fill
backgroundColor = "#F6F7F9"          # Slate canvas
secondaryBackgroundColor = "#FFFFFF" # Slate surface - widgets match card surfaces
codeBackgroundColor = "#F0F3F6"      # Slate subtle surface tint
textColor = "#20262E"                # Slate text/ink
linkColor = "#456AAC"                # Slate information
borderColor = "#E2E6EB"              # Slate border
codeTextColor = "#20262E"
showWidgetBorder = true
baseRadius = "0.625rem"              # Slate card radius (10px)
buttonRadius = "0.375rem"            # Slate control radius (6px)

# Typography - one Inter family for headings and body, weight and size
# carry the hierarchy instead of a second display face
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["29px", "22px", "18px", "15px", "13px", "11px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors, mapped onto Streamlit's fixed 8-slot palette. Slate
# names only four hues (Positive/Negative/Warning/Information); the
# heartbeat and risk-limit bands need two distinct amber tiers, so
# `orange` is a deliberately darker, more saturated amber derived from
# `yellow` rather than a Slate-documented token.
greenColor = "#137552"  # Slate positive
redColor = "#B63E49"    # Slate negative
yellowColor = "#946315" # Slate warning
orangeColor = "#6F430C" # Elevated warning tier, darker than yellow
blueColor = "#456AAC"   # Slate information
grayColor = "#626D7C"   # Slate secondary text

# Chart colors - slate and lavender first, financial red kept distinguishable
chartCategoricalColors = [
    "#5B7C99",
    "#8B7EF0",
    "#15171C",
    "#E8B93C",
    "#3E8FD0",
    "#E2574C",
    "#8A8D91",
]

# Sequential colors for heatmaps (grey gradient)
chartSequentialColors = [
    "#F2F2F1",
    "#E1E2DF",
    "#CFD0CC",
    "#BCBDB8",
    "#A8AAA4",
    "#94968F",
    "#80827A",
    "#6C6E66",
    "#585A52",
    "#44463F",
]

# Dataframe styling. The body is painted white through a pandas Styler (see
# `style_table` in jolteon/dashboard/components.py) because Streamlit only exposes
# the header and border here, so the header just needs to sit a step deeper
# than that white body to read as a band. It stays light on purpose:
# the grid draws its header labels in `fadedText60` (the theme's text color
# at 60%) with no way to override them, and it renders to a canvas, so CSS
# can't recolor them either - on a dark header the labels simply disappear.
dataframeBorderColor = "#E2E6EB"
dataframeHeaderBackgroundColor = "#F6F7F9"
