<!doctype html>
<!--
A minimal Streamlit "static" custom component (see Streamlit's docs on
building components without a frontend framework): it speaks the raw
postMessage protocol itself instead of pulling in streamlit-component-lib,
since a single metric tile needs only "I'm ready" and "here are new args".

This is what makes NumberFlow's digit-roll animation possible at all: a
component's iframe here is a persistent document that Streamlit updates by
posting new args into it, not by regenerating the iframe's `srcdoc` (which
`st.html` does, tearing the document down every rerun). NumberFlow animates
a value *change* on an element that's stayed mounted since the last render;
a fresh element on a fresh document has no previous value to animate from.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="metric" id="metric">
    <div class="label">
      <span id="label"></span>
    </div>
    <number-flow class="value" id="value"></number-flow>
  </div>
  <script src="./number-flow.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
