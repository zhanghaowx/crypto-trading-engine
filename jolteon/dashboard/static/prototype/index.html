<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Jolteon · Live monitor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="#monitor" aria-label="Jolteon home"><span class="brand-mark">ϟ</span><span class="brand-name">jolteon</span></a>

    <div class="header-end">
      <span class="demo-label">DESIGN PREVIEW <span>Sample data</span></span>
    </div>
  </header>
  <div class="nav-shell"><nav id="nav" aria-label="Main navigation"></nav></div>
