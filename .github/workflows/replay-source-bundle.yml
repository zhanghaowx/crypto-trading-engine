name: Temporary development source bundle
on:
  push:
    branches:
      - feature/binance-replay-clock
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack repository sources
        run: tar -czf repo-src.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: replay-development-source
          path: repo-src.tar.gz
          retention-days: 1
